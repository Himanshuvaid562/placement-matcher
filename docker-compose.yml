# Production-like stack:  JWT_SECRET=... OFFICER_INVITE_CODE=... docker compose up --build
# For day-to-day development use backend/docker-compose.yml (Mongo only) + npm run dev instead.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/p06_placement
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      OFFICER_INVITE_CODE: ${OFFICER_INVITE_CODE:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "3000:3000"

volumes:
  mongo_data:
